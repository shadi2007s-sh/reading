<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التطبيق التفاعلي - دعم كامل لـ iPad</title>
  <style>
    :root {
      --primary-color: #4a90e2;
      --success-color: #2ecc71;
      --warning-color: #e2725b;
      --bg-color: #f4f7f6;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    h2 {
      color: #333;
      margin-bottom: 20px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-main { background-color: var(--primary-color); color: white; }
    .btn-success { background-color: var(--success-color); color: white; }
    button:active { transform: scale(0.96); }

    /* نافذة التنبيه والحلول Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 16px;
      max-width: 450px;
      width: 100%;
      text-align: right;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .modal-content h3 { color: var(--warning-color); margin-top: 0; }
    .modal-content ul { padding-right: 20px; line-height: 1.6; }
    .modal-content .tip-box {
      background: #fff3cf;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin: 15px 0;
    }

    .status-text {
      margin-top: 15px;
      font-size: 0.95rem;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>التمرين التفاعلي ✏️</h2>
    <p>اقرأ الكلمة بصوت عالٍ أو استخدم الزر اليدوي عند الحاجة:</p>
    
    <div class="btn-group">
      <button class="btn-main" onclick="listenSpeech()">🎤 التحدث (المايك)</button>
      <button class="btn-success" onclick="markCorrect()">✓ صح (تقييم يدوي)</button>
    </div>

    <div id="status" class="status-text">جاهز لبدء التمرين...</div>
  </div>

  <!-- نافذة الحلول عند وجود مشكلة توافق على iPad -->
  <div id="fixModal" class="modal-overlay">
    <div class="modal-content">
      <h3>تنبيه توافق الجهاز 📱</h3>
      <div id="modalBody"></div>
      <button class="btn-main" style="width: 100%; margin-top: 15px; justify-content: center;" onclick="closeFixModal()">حسناً، فهمت</button>
    </div>
  </div>

  <script>
    /* ===== المتغيرات العامة ===== */
    let ac = null;
    let recognition = null;

    // تهيئة الصوت والنطق
    function initAudioContext() {
      if (!ac) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) ac = new AudioCtx();
      }
    }

    /* ===== 1. فك حظر الصوت في iOS / iPad ===== */
    function unlockIOSAudio() {
      const unlock = () => {
        initAudioContext();
        
        // فك حظر محرك نطق الكلمات (SpeechSynthesis)
        if ('speechSynthesis' in window) {
          const u = new SpeechSynthesisUtterance('');
          window.speechSynthesis.speak(u);
        }
        
        // فك حظر نغمات AudioContext
        if (ac && ac.state === 'suspended') {
          ac.resume();
        }

        // إزالة المستمعات بعد التفعيل الأول
        document.removeEventListener('touchstart', unlock);
        document.removeEventListener('click', unlock);
      };

      document.addEventListener('touchstart', unlock, { once: true });
      document.addEventListener('click', unlock, { once: true });
    }

    /* ===== 2. فحص توافق iPad و iOS ===== */
    function checkiPadCompatibility() {
      // الكشف عن iPad حتى في حال التصفح بوضع سطح المكتب (iPadOS 13+)
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      
      const isSecure = window.location.protocol === 'https:' || 
                       window.location.hostname === 'localhost' || 
                       window.location.protocol === 'file:';
                       
      const hasSR = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
      const hasTTS = 'speechSynthesis' in window;

      let issues = [];

      // فحص الاتصال الآمن (HTTPS ضروري لتشغيل المايك)
      if (!isSecure) {
        issues.push("يجب فتح التطبيق عبر رابط آمن (HTTPS) ليعمل المايك بشكل صحيح.");
      }

      // فحص دعم التعرف على الصوت
      if (!hasSR) {
        issues.push("خاصية التعرف الصوتي (المايك) غير مدعومة على هذا المتصفح.");
      }

      // فحص نطق الصوت
      if (!hasTTS) {
        issues.push("خاصية نطق الصوت غير مدعومة في متصفحك الحالي.");
      }

      // إظهار الحلول إذا كانت هناك قيود
      if (issues.length > 0) {
        showFixModal(issues, isIOS && !hasSR);
      }
    }

    /* ===== 3. عرض نافذة التنبيه والحلول ===== */
    function showFixModal(issuesList, isNonSafariIOS) {
      const modalBody = document.getElementById('modalBody');
      
      let html = `<ul>${issuesList.map(item => `<li>${item}</li>`).join('')}</ul>`;

      if (isNonSafariIOS) {
        html += `
          <div class="tip-box">
            <b>حل مشكلة المايك على iPad:</b><br>
            Apple تمنع المايك عن المتصفحات الخارجية. يرجى نسخ رابط الصفحة وافتحه باستخدام متصفح <b>Safari</b>.
          </div>
        `;
      }

      html += `<p style="font-size:0.85rem; color:#666;">يمكنك دائماً استكمال التمرين يدوياً باستخدام زر <b>(✓ صح)</b>.</p>`;

      modalBody.innerHTML = html;
      document.getElementById('fixModal').classList.add('active');
    }

    function closeFixModal() {
      document.getElementById('fixModal').classList.remove('active');
    }

    /* ===== 4. التشغيل التفاعلي للمايك والنطق ===== */
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // إيقاف أي صوت سابق
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ar-SA';
        window.speechSynthesis.speak(msg);
      }
    }

    function listenSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        checkiPadCompatibility();
        return;
      }

      if (!recognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ar-SA';
        recognition.interimResults = false;

        recognition.onstart = () => {
          document.getElementById('status').innerText = "جاري الاستماع... اتكلم الآن";
        };

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          document.getElementById('status').innerText = `تم الالتقاط: "${transcript}"`;
          speakText("أحسنت! إجابة رائعة");
        };

        recognition.onerror = (event) => {
          document.getElementById('status').innerText = "تعذر الاستماع، استخدم زر (✓ صح).";
          checkiPadCompatibility();
        };
      }

      try {
        recognition.start();
      } catch (e) {
        recognition.stop();
      }
    }

    function markCorrect() {
      document.getElementById('status').innerText = "تم الاعتماد يدوياً! ممتاز 👍";
      speakText("أحسنت عمل رائع");
    }

    /* ===== بدء الفحص عند تحميل الصفحة ===== */
    window.addEventListener('DOMContentLoaded', () => {
      unlockIOSAudio();
      checkiPadCompatibility();
    });
  </script>
</body>
</html>
