<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تدريب القراءة - النسخة المبسطة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;700;800&display=swap');
:root{--ink:#293842;--blue:#55a8d3;--green:#32955e;--gold:#f5b623;--cream:#fffdf8;--line:#d9d1bd}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef9fc,#fffaf0 55%,#edf8f0);font-family:"Baloo Bhaijaan 2","Noto Naskh Arabic",Tahoma,sans-serif;color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:18px 14px 30px}
header{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:1.45rem;margin:0}
.topbtn{border:2px solid var(--line);background:#fff;border-radius:13px;padding:8px 12px;font-weight:800;cursor:pointer}
.card{background:var(--cream);border:3px solid #e7deca;border-radius:28px;box-shadow:0 8px 24px #00000012}
.text-tools{padding:12px;margin-bottom:12px}
.toolrow{display:flex;gap:8px;flex-wrap:wrap}
select,input,textarea{font:inherit}
select,input{border:2px solid #d9d1bd;border-radius:12px;padding:8px;background:#fff}
#savedTextSel{flex:1;min-width:220px}
button{font-family:inherit;cursor:pointer}
.primary{background:var(--blue);color:#fff;border:2px solid #438eb7;border-radius:14px;padding:9px 14px;font-weight:800;box-shadow:0 3px 0 #3b89ae}
.green{background:var(--green);color:#fff;border:2px solid #2b8051;border-radius:14px;padding:10px 16px;font-weight:800;box-shadow:0 4px 0 #247548}
.gold{background:var(--gold);color:#293842;border:2px solid #e3a91a;border-radius:14px;padding:11px 16px;font-weight:800;box-shadow:0 4px 0 #d59e16}
.ghost{background:#fff;border:2px solid #c8dce7;border-radius:14px;padding:10px 14px;font-weight:800;box-shadow:0 3px 0 #b8d2df}
.meta{text-align:center;color:#687780;background:#f8fbfc;border:1px solid #d7e4e9;border-radius:14px;padding:7px;margin-bottom:8px}
.reader{padding:16px 18px 18px}
.counter{text-align:center;font-weight:800;font-size:1.1rem;color:#687780}
.bigword{min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:5.2rem;font-weight:800;padding:20px}
.ghostw{text-align:center;min-height:35px;color:#d5cdbb;font-size:1.2rem}
.progress{height:14px;background:#e4ddca;border-radius:99px;overflow:hidden;margin:0 0 12px}
.progress i{display:block;height:100%;width:0;background:#d1b65d;transition:.2s}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.mode{padding:11px;border:2px solid #c9ddea;background:#fff;border-radius:15px;font-weight:800;font-size:1rem}
.mode.active{background:var(--blue);color:#fff;border-color:#438eb7}
.pause{display:flex;gap:8px;margin-bottom:10px}
.pause button{flex:1}
.fullview{background:#fff;border:2px solid #e7deca;border-radius:20px;padding:22px;line-height:2.25;font-size:1.55rem;min-height:260px;margin-bottom:12px}
.fullview.hide,.hide{display:none!important}
.w{display:inline;border-radius:7px;padding:2px 3px;cursor:pointer}
.w.done{color:#aaa}
.w.now{background:#ffe7a3;outline:2px solid #f0c85e}
.actions{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px}
.actions button{min-height:54px;font-size:1.02rem}
.wide{grid-column:1/-1}
.status{min-height:46px;margin-top:10px;background:#eef8fc;border:2px solid #cce5ef;border-radius:14px;padding:10px;text-align:center;color:#49636d}
.dialog{border:0;border-radius:22px;padding:0;width:min(700px,calc(100% - 24px));box-shadow:0 20px 60px #0003}
.dialog::backdrop{background:#0006}
.dinner{padding:18px}
.dinner h2{margin-top:0}
#textName{width:100%;margin-bottom:8px}
#newText{width:100%;min-height:220px;border:2px solid #d9d1bd;border-radius:15px;padding:12px;resize:vertical}
.saved-list{margin-top:12px;max-height:180px;overflow:auto}
.saved-item{display:flex;justify-content:space-between;gap:8px;padding:8px;border-bottom:1px solid #eee}
.small{font-size:.82rem;color:#718089}
@media(max-width:620px){.wrap{padding:10px 8px}.bigword{font-size:4rem;min-height:190px}.fullview{font-size:1.3rem}.actions{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}.topbtn{font-size:.8rem}}
</style>
<script>
window.READING_APP_CONFIG = window.READING_APP_CONFIG || {
  TOKEN_ENDPOINT:'https://reading-speech-api-e9hbc8fscfaxacgv.israelcentral-01.azurewebsites.net/api/speech-token',
  REGION:'eastus',
  VOICE:'ar-JO-SanaNeural',
  SDK_URL:'https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.46.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js'
};
</script>
</head>
<body>
<div class="wrap">
<header>
  <h1>📖 تدريب القراءة</h1>
  <button class="topbtn" id="advancedBtn">النسخة الحالية ⚙️</button>
</header>

<section class="card text-tools">
  <div class="toolrow">
    <select id="savedTextSel" aria-label="النصوص المحفوظة"></select>
    <button class="primary" id="manageBtn">➕ إضافة / تعديل نص</button>
  </div>
  <div class="small" id="savedInfo" style="margin-top:7px"></div>
</section>

<div class="meta" id="textMeta">📖 النص · 0 كلمة</div>

<section class="card reader">
  <div id="wordView">
    <div class="counter">الكلمة <span id="cnow">1</span> من <span id="ctot">1</span></div>
    <div class="ghostw" id="prevw"></div>
    <div class="bigword" id="bigword">…</div>
    <div class="ghostw" id="nextw"></div>
  </div>

  <div id="fullView" class="fullview hide"></div>

  <div class="progress"><i id="fill"></i></div>

  <div class="modes">
    <button class="mode" data-mode="full">📖 النص كامل</button>
    <button class="mode active" data-mode="word">🔠 كلمة</button>
  </div>

  <div class="pause">
    <button class="ghost" id="listenBtn">🔊 اسمعي</button>
    <button class="ghost" id="pauseBtn">⏸ إيقاف مؤقت</button>
  </div>

  <div class="actions">
    <button class="green" id="micBtn">🎤 ابدئي القراءة</button>
    <button class="ghost" id="okBtn">✓ صح</button>
    <button class="ghost" id="prevBtn">⏮ السابقة</button>
    <button class="ghost" id="nextBtn">⏭ التالية</button>
    <button class="gold wide" id="readFullBtn">📖 اقرأ لي النص</button>
  </div>

  <div class="status" id="status">اختاري كلمة وابدئي القراءة.</div>
</section>
</div>

<dialog class="dialog" id="textDlg">
<div class="dinner">
  <h2>📝 إضافة نص جديد</h2>
  <input id="textName" placeholder="اسم النص، مثل: درس القراءة 1">
  <textarea id="newText" placeholder="اكتبي النص العربي هنا..."></textarea>
  <div class="toolrow" style="margin-top:10px">
    <button class="green" id="saveNewBtn">💾 حفظ كنص جديد</button>
    <button class="primary" id="updateBtn">✏️ تحديث النص الحالي</button>
    <button class="ghost" id="deleteBtn">🗑 حذف النص</button>
    <button class="ghost" id="closeDlg">إغلاق</button>
  </div>
  <div class="small" style="margin-top:10px">النصوص محفوظة على هذا الجهاز داخل المتصفح.</div>
</div>
</dialog>

<script>
(() => {
const CFG=window.READING_APP_CONFIG||{};
const DEFAULT_TEXT="تدوين رؤوس الأقلام إحدى التقنيات التي دعت الحاجة إليها، نظرًا لكثرة وسائل الاتصال، فلم لا تبادر إلى استخدام هذه التقنية في دراستك؟";
const TEXT_KEY="readingSimpleTextsV1", SELECT_KEY="readingSimpleSelectedV1";
let saved=[], current=null, words=[], idx=0, score=0, mode="word", reading=false, paused=false;
let audio=null, audioUrl="", micToken=0, micState={stream:null,recorder:null,chunks:[],timer:0,ctx:null,source:null,analyser:null,silenceTimer:0,monitorTimer:0,sawSpeech:false,startedAt:0};
const $=id=>document.getElementById(id);
const say=t=>$("status").textContent=t;
const uid=()=>Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function loadTexts(){
  try{saved=JSON.parse(localStorage.getItem(TEXT_KEY)||"[]");if(!Array.isArray(saved))saved=[]}catch(e){saved=[]}
  if(!saved.length)saved=[{id:uid(),name:"النص الافتراضي",text:DEFAULT_TEXT}];
  let id="";try{id=localStorage.getItem(SELECT_KEY)||""}catch(e){}
  current=saved.find(x=>x.id===id)||saved[0]; saveTexts(); renderSelector(); build(current.text);
}
function saveTexts(){try{localStorage.setItem(TEXT_KEY,JSON.stringify(saved));if(current)localStorage.setItem(SELECT_KEY,current.id)}catch(e){}}
function renderSelector(){
  $("savedTextSel").innerHTML=saved.map(x=>`<option value="${escapeHtml(x.id)}">${escapeHtml(x.name)}</option>`).join("");
  if(current)$("savedTextSel").value=current.id;
  $("savedInfo").textContent=`${saved.length} ${saved.length===1?"نص محفوظ":"نصوص محفوظة"} — تُحفظ تلقائيًا على هذا الجهاز`;
}
function cleanText(t){return String(t||"").replace(/\s+/g," ").trim()}
function build(text){
  stopReading(); stopMic();
  const clean=cleanText(text);
  words=clean?clean.split(/\s+/):[];
  idx=0;score=0;
  $("textName").value=current?.name||"";
  $("newText").value=clean;
  $("textMeta").textContent=`📖 ${current?.name||"النص"} · ${words.length} كلمة · ${clean.length} حرف`;
  render();
}
function render(){
  const total=words.length||1;
  $("cnow").textContent=Math.min(idx+1,total); $("ctot").textContent=words.length||0;
  $("bigword").textContent=words[idx]||"🎉";
  $("prevw").textContent=idx>0?words[idx-1]:"";
  $("nextw").textContent=idx<words.length-1?words[idx+1]:"";
  $("fill").style.width=(words.length?Math.round(idx/words.length*100):0)+"%";
  document.querySelectorAll(".w").forEach((e,i)=>{e.classList.toggle("done",i<idx);e.classList.toggle("now",i===idx&&!reading)});
  renderFull();
}
function renderFull(){
  const box=$("fullView"); box.innerHTML="";
  words.forEach((w,i)=>{const s=document.createElement("span");s.className="w"+(i<idx?" done":"")+(i===idx&&!reading?" now":"");s.textContent=w;s.onclick=()=>{idx=i;render();};box.appendChild(s);box.appendChild(document.createTextNode(" "));});
}
function setMode(m){
  mode=m; document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));
  $("wordView").classList.toggle("hide",m!=="word"); $("fullView").classList.toggle("hide",m!=="full");
  render();
}
function stopReading(){
  reading=false;paused=false;
  try{speechSynthesis.cancel()}catch(e){}
  if(audio){try{audio.pause();audio.currentTime=0}catch(e){}}
  $("listenBtn").textContent="🔊 اسمعي"; $("pauseBtn").textContent="⏸ إيقاف مؤقت";
  document.querySelectorAll(".w").forEach(e=>e.classList.remove("now"));
  render();
}
async function getToken(){
  const r=await fetch(CFG.TOKEN_ENDPOINT,{cache:"no-store"});if(!r.ok)throw Error("فشل الحصول على Speech token");return r.json();
}
async function azureSpeak(text){
  const t=await getToken();
  const r=await fetch(`https://${CFG.REGION||t.region||"eastus"}.tts.speech.microsoft.com/cognitiveservices/v1`,{
    method:"POST",
    headers:{"Authorization":"Bearer "+t.token,"Content-Type":"application/ssml+xml","X-Microsoft-OutputFormat":"riff-24khz-16bit-mono-pcm"},
    body:`<speak version="1.0" xml:lang="ar-JO"><voice name="${CFG.VOICE||"ar-JO-SanaNeural"}">${escapeXml(text)}</voice></speak>`,
    cache:"no-store"
  });
  if(!r.ok)throw Error("TTS_HTTP_"+r.status);
  return new Blob([await r.arrayBuffer()],{type:"audio/wav"});
}
function escapeXml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;")}
async function speakText(text){
  if(!text)return;
  try{
    const blob=await azureSpeak(text);
    if(audio){try{audio.pause()}catch(e){}}
    if(audioUrl)try{URL.revokeObjectURL(audioUrl)}catch(e){}
    audioUrl=URL.createObjectURL(blob); audio=new Audio(audioUrl);
    await audio.play();
  }catch(e){
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="ar-JO";u.rate=.72;speechSynthesis.speak(u)}catch(x){}
    say("🔊 تم استخدام صوت الجهاز كاحتياط.");
  }
}
function readWord(){const w=words[idx];if(!w)return;speakText(w);say("🔊 اسمعي الكلمة ثم اقرئيها.")}
async function readFull(){
  if(!words.length)return;
  if(reading){stopReading();return}
  reading=true;paused=false;idx=0;$("readFullBtn").textContent="⏹ إيقاف القراءة";$("pauseBtn").textContent="⏸ إيقاف مؤقت";
  if(mode==="word") setMode("full");
  try{
    // One Azure request for the full text; the simplified page does not preload/cache it.
    const blob=await azureSpeak(words.join(" "));
    if(!reading)return;
    if(audioUrl)try{URL.revokeObjectURL(audioUrl)}catch(e){}
    audioUrl=URL.createObjectURL(blob);audio=new Audio(audioUrl);
    audio.ontimeupdate=()=>{if(!audio||!audio.duration)return;const p=Math.max(0,Math.min(0.999,audio.currentTime/audio.duration));idx=Math.min(words.length-1,Math.floor(p*words.length));render()};
    audio.onended=()=>{reading=false;$("readFullBtn").textContent="📖 اقرأ لي النص";render()};
    await audio.play();say("📖 استمعي إلى النص الكامل.");
  }catch(e){reading=false;$("readFullBtn").textContent="📖 اقرأ لي النص";say("⚠️ تعذر تشغيل صوت النص.");}
}
function resetMicState(){
  clearTimeout(micState.timer);clearTimeout(micState.silenceTimer);clearTimeout(micState.monitorTimer);
  try{micState.source?.disconnect()}catch(e){} try{micState.analyser?.disconnect()}catch(e){} try{micState.ctx?.close()}catch(e){}
  try{micState.stream?.getTracks().forEach(t=>t.stop())}catch(e){}
  micState={stream:null,recorder:null,chunks:[],timer:0,ctx:null,source:null,analyser:null,silenceTimer:0,monitorTimer:0,sawSpeech:false,startedAt:0};
}
function chooseMime(){const a=["audio/ogg;codecs=opus","audio/webm;codecs=opus","audio/webm","audio/mp4"];return a.find(x=>MediaRecorder.isTypeSupported?.(x))||""}
function monitorSpeech(stream,rec,token){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{
    const ctx=new AC(),src=ctx.createMediaStreamSource(stream),an=ctx.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.15;src.connect(an);
    micState.ctx=ctx;micState.source=src;micState.analyser=an;micState.startedAt=Date.now();micState.sawSpeech=false;
    const data=new Uint8Array(an.fftSize);
    const check=()=>{if(token!==micToken||!micState.recorder||micState.recorder!==rec)return;an.getByteTimeDomainData(data);let sum=0;for(const v of data){const x=(v-128)/128;sum+=x*x}const rms=Math.sqrt(sum/data.length),elapsed=Date.now()-micState.startedAt;
      if(rms>.035){micState.sawSpeech=true;clearTimeout(micState.silenceTimer);micState.silenceTimer=0}
      else if(micState.sawSpeech&&elapsed>1100&&!micState.silenceTimer){micState.silenceTimer=setTimeout(()=>{try{if(rec.state!=="inactive")rec.stop()}catch(e){}},650)}
      micState.monitorTimer=setTimeout(check,120)};
    ctx.resume().catch(()=>{});check();
  }catch(e){}
}
async function blobToWav(blob){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error("AUDIO_CONTEXT_UNSUPPORTED");
  const ctx=new AC();
  try{
    const decoded=await ctx.decodeAudioData((await blob.arrayBuffer()).slice(0)),rate=16000,frames=Math.max(1,Math.ceil(decoded.duration*rate)),offctx=new OfflineAudioContext(1,frames,rate);
    const src=offctx.createBufferSource();src.buffer=decoded;src.connect(offctx.destination);src.start(0);const rendered=await offctx.startRendering(),ch=rendered.getChannelData(0),dataLen=ch.length*2;
    let peak=0;for(let i=0;i<ch.length;i++)peak=Math.max(peak,Math.abs(ch[i]));const gain=peak>.01?Math.min(3,.9/peak):1;
    const out=new ArrayBuffer(44+dataLen),dv=new DataView(out),wr=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i))};
    wr(0,"RIFF");dv.setUint32(4,36+dataLen,true);wr(8,"WAVE");wr(12,"fmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,rate,true);dv.setUint32(28,rate*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);wr(36,"data");dv.setUint32(40,dataLen,true);
    let o=44;for(let i=0;i<ch.length;i++){const x=Math.max(-1,Math.min(1,ch[i]*gain));dv.setInt16(o,x<0?x*0x8000:x*0x7fff,true);o+=2}
    return new Blob([out],{type:"audio/wav"});
  }finally{try{await ctx.close()}catch(e){}}
}
async function transcribe(wav,tok){
  const url=`https://${CFG.REGION||"eastus"}.stt.speech.microsoft.com/speech/recognition/conversation/cognitiveservices/v1?language=ar-SA&format=detailed`;
  const r=await fetch(url,{method:"POST",headers:{"Authorization":"Bearer "+tok,"Content-Type":"audio/wav; codecs=audio/pcm; samplerate=16000","Accept":"application/json"},body:wav,cache:"no-store"});
  const body=await r.text();if(!r.ok)throw Error("STT_HTTP_"+r.status);
  let data={};try{data=JSON.parse(body||"{}")}catch(e){throw Error("STT_BAD_JSON")}
  let text=(data.DisplayText||data.NBest?.[0]?.Display||"").trim();if(text&&/[A-Za-z]/.test(text))text="";
  return {text,data};
}
function norm(s){return String(s||"").replace(/[\u064B-\u0652\u0670\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/[^\u0621-\u064A]/g,"")}
function similarity(a,b){a=norm(a);b=norm(b);if(a===b)return 1;if(!a||!b)return 0;let m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>{const r=Array(n+1);r[0]=i;return r});for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return 1-d[m][n]/Math.max(m,n)}
async function startMic(){
  if(reading)stopReading();if(mode!=="word"){say("🎤 القراءة الصوتية هنا للكلمة الحالية. اختاري «كلمة».");return}
  const token=++micToken;
  if(!window.isSecureContext || location.protocol!=="https:"){
    say("🔒 تشغيل المايك على iPad يحتاج فتح الصفحة من رابط HTTPS مثل GitHub Pages، وليس من ملف HTML محفوظ على الجهاز.");
    return;
  }
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){say("⚠️ المتصفح لا يدعم تسجيل المايك.");return}
  resetMicState();
  try{
    say("🎙 اقرئي الكلمة الآن: "+(words[idx]||""));
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    if(token!==micToken){stream.getTracks().forEach(t=>t.stop());return}
    const mime=chooseMime(),rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);micState.stream=stream;micState.recorder=rec;
    rec.ondataavailable=e=>{if(e.data?.size)micState.chunks.push(e.data)};
    rec.onstop=async()=>{
      const blob=new Blob(micState.chunks,{type:rec.mimeType||mime||"audio/webm"});resetMicState();$("micBtn").textContent="🎤 ابدئي القراءة";
      if(token!==micToken)return;
      try{
        say("☁️ أتعرف على الكلمة…");const t=await getToken();const wav=await blobToWav(blob);const r=await transcribe(wav,t.token);
        if(!r.text){say("🎤 لم أفهم الكلمة بوضوح. جرّبي تحكيها ببطء وبصوت أعلى قليلاً.");return}
        const sim=similarity(r.text,words[idx]);if(sim>=.72){score++;idx=Math.min(idx+1,words.length-1);say("✅ ممتاز! فهمت: "+r.text);render()}else{say("🔁 سمعت: "+r.text+" — جرّبي الكلمة مرة أخرى.")}
      }catch(e){console.error(e);say("⚠️ تعذر التعرف على الكلام.")}
    };
    rec.start();$("micBtn").textContent="⏹ إيقاف التسجيل";monitorSpeech(stream,rec,token);
    micState.timer=setTimeout(()=>{try{if(rec.state!=="inactive")rec.stop()}catch(e){}},3800);
  }catch(e){
    resetMicState();
    console.error("iPad microphone error",e);
    if(e?.name==="NotAllowedError")say("🎤 Safari منع استخدام المايك. افتحي الصفحة في Safari من رابط HTTPS، ثم اسمحي للمايك من إعدادات الموقع.");
    else if(e?.name==="SecurityError")say("🔒 Safari يمنع المايك في هذا السياق. استخدمي صفحة HTTPS مباشرة وليست معاينة أو ملفًا محليًا.");
    else if(e?.name==="OverconstrainedError")say("🎤 إعدادات المايك غير مناسبة لهذا الجهاز. اضغطي مرة أخرى للمحاولة.");
    else say("⚠️ تعذر تشغيل المايك: "+(e?.message||e));
  }
}
function stopMic(){++micToken;try{if(micState.recorder&&micState.recorder.state!=="inactive")micState.recorder.stop()}catch(e){}resetMicState();$("micBtn").textContent="🎤 ابدئي القراءة"}
$("savedTextSel").onchange=()=>{const t=saved.find(x=>x.id===$("savedTextSel").value);if(t){current=t;saveTexts();build(t.text);say("📖 تم اختيار: "+t.name)}};
$("manageBtn").onclick=()=>{$("textName").value=current?.name||"";$("newText").value=current?.text||"";$("textDlg").showModal()};
$("closeDlg").onclick=()=>$("textDlg").close();
$("saveNewBtn").onclick=()=>{
  const name=($("textName").value||"").trim()||`نص ${saved.length+1}`,text=cleanText($("newText").value);if(!text){say("اكتبي نصًا أولًا.");return}
  current={id:uid(),name,text};saved.push(current);saveTexts();renderSelector();build(text);$("textDlg").close();say("✅ تم حفظ النص الجديد.");
};
$("updateBtn").onclick=()=>{
  const text=cleanText($("newText").value);if(!text){say("اكتبي نصًا أولًا.");return}
  const i=saved.findIndex(x=>x.id===current.id);if(i<0)return;current={...current,name:($("textName").value||"").trim()||current.name,text};saved[i]=current;saveTexts();renderSelector();build(text);$("textDlg").close();say("✅ تم تحديث النص.");
};
$("deleteBtn").onclick=()=>{
  if(saved.length<=1){say("يجب أن يبقى نص واحد على الأقل.");return}
  const i=saved.findIndex(x=>x.id===current.id);saved.splice(i,1);current=saved[Math.max(0,i-1)];saveTexts();renderSelector();build(current.text);$("textDlg").close();say("🗑 تم حذف النص.");
};
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$("listenBtn").onclick=()=>mode==="word"?readWord():speakText(words.join(" "));
$("readFullBtn").onclick=readFull;
$("pauseBtn").onclick=()=>{if(!audio)return;if(audio.paused){audio.play();$("pauseBtn").textContent="⏸ إيقاف مؤقت"}else{audio.pause();$("pauseBtn").textContent="▶️ متابعة"}};
$("okBtn").onclick=()=>{if(!words.length)return;score++;idx=Math.min(idx+1,words.length-1);say("✓ أحسنتِ!");render()};
$("prevBtn").onclick=()=>{idx=Math.max(0,idx-1);render();say("الكلمة السابقة")};
$("nextBtn").onclick=()=>{idx=Math.min(words.length-1,idx+1);render();say("الكلمة التالية")};
$("micBtn").onclick=()=>{if(micState.recorder)stopMic();else startMic()};
$("advancedBtn").onclick=()=>{location.href="reading_app.html"};
loadTexts();setMode("word");
})();
</script>
</body>
</html>
