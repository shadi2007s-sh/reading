<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تدريب القراءة العربية</title>

<style>
:root{
  --bg:#f5f7fb;
  --card:#fff;
  --text:#1f2937;
  --muted:#6b7280;
  --line:#e5e7eb;
  --primary:#2563eb;
  --good:#15803d;
  --bad:#dc2626;
  --now:#dbeafe;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:18px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  box-shadow:0 8px 30px #00000008;
  margin-bottom:14px;
}

h1{
  font-size:24px;
  margin:0 0 8px;
}

.sub{
  color:var(--muted);
  font-size:14px;
}

select,textarea,input,button{
  font:inherit;
}

select,textarea,input{
  width:100%;
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px;
  background:#fff;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.row>*{
  flex:1 1 160px;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 15px;
  cursor:pointer;
  background:#eef2ff;
  color:#111827;
  font-weight:700;
}

button.primary{
  background:var(--primary);
  color:#fff;
}

button.danger{
  background:#fee2e2;
  color:#991b1b;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.mode{
  display:flex;
  gap:8px;
}

.mode button{
  flex:1;
}

.mode button.active{
  background:var(--primary);
  color:#fff;
}

.reading{
  font-size:30px;
  line-height:2.1;
  min-height:150px;
  padding:10px;
  text-align:right;
}

.w{
  display:inline-block;
  padding:0 4px;
  border-radius:7px;
  margin:0 2px;
  transition:.15s;
}

.w.now{
  background:var(--now);
}

.w.done{
  opacity:.55;
}

.w.read-good{
  background:#dcfce7;
  color:var(--good);
}

.w.read-bad{
  background:#fee2e2;
  color:var(--bad);
}

.big{
  font-size:46px;
  text-align:center;
  font-weight:800;
  margin:14px 0;
}

.bar{
  height:9px;
  border-radius:99px;
  background:#e5e7eb;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0;
  background:var(--primary);
  transition:.2s;
}

.status{
  text-align:center;
  min-height:28px;
  margin-top:12px;
  font-weight:700;
}

.score{
  font-size:26px;
  text-align:center;
  margin:8px 0;
}

.hint{
  color:var(--muted);
  font-size:13px;
  margin-top:8px;
}

.actions{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.actions button:first-child{
  grid-column:1/-1;
}

@media(max-width:600px){
  .wrap{
    padding:10px;
  }

  h1{
    font-size:21px;
  }

  .reading{
    font-size:25px;
  }

  .big{
    font-size:38px;
  }

  .actions{
    grid-template-columns:1fr;
  }

  .actions button:first-child{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">
    <h1>📖 تدريب القراءة العربية</h1>
    <div class="sub">
      استمعي، اقرئي، ثم افحصي النطق بالميكروفون.
    </div>
  </div>

  <div class="card">

    <div class="row">

      <div>
        <label>النص</label>
        <select id="textSelect"></select>
      </div>

      <div>
        <label>وضع التقييم</label>

        <div class="mode">
          <button data-mode="word" class="active">كلمة</button>
          <button data-mode="sentence">جملة</button>
          <button data-mode="full">النص</button>
        </div>

      </div>

    </div>

    <div class="row" style="margin-top:10px">

      <input
        id="newTextName"
        placeholder="اسم نص جديد"
      >

      <button id="saveTextBtn">
        💾 حفظ النص
      </button>

      <button id="deleteTextBtn" class="danger">
        🗑 حذف النص
      </button>

    </div>

    <textarea
      id="textEditor"
      placeholder="اكتبي النص هنا..."
    ></textarea>

    <div class="hint">
      النصوص تُحفظ على هذا الجهاز فقط.
    </div>

  </div>

  <div class="card">

    <div class="big" id="bigWord">
      —
    </div>

    <div class="reading" id="reading"></div>

    <div class="bar">
      <div class="fill" id="progress"></div>
    </div>

    <div class="score" id="score"></div>

    <div class="status" id="status"></div>

  </div>

  <div class="card actions">

    <button id="micBtn" class="primary">
      🎤 ابدئي التقييم
    </button>

    <button id="sayBtn">
      🔊 اسمعي
    </button>

    <button id="prevBtn">
      ⬅ السابقة
    </button>

    <button id="nextBtn">
      التالية ➡
    </button>

    <button id="resetBtn">
      ↺ إعادة التعيين
    </button>

  </div>

</div>

<script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>

<script>

const CONFIG = {
  tokenEndpoint:
    'https://reading-speech-api-e9hbc8fscfaxacgv.israelcentral-01.azurewebsites.net/api/speech-token',

  region:'eastus',

  voice:'ar-JO-SanaNeural'
};


const DEFAULT_TEXTS = [

  {
    id:'default1',
    name:'النص الأول',
    text:'ذهبَ خالدٌ إلى المدرسةِ صباحًا، وقرأَ درسًا جميلًا مع زملائه.'
  },

  {
    id:'default2',
    name:'النص الثاني',
    text:'القراءةُ كلَّ يومٍ تساعدُنا على فهمِ الكلماتِ والتعبيرِ عن أفكارِنا بوضوح.'
  }

];


let texts = [];
let currentText = null;
let mode = 'word';
let words = [];
let idx = 0;
let speechToken = null;


const $ = id => document.getElementById(id);

const textSelect = $('textSelect');
const textEditor = $('textEditor');
const reading = $('reading');
const bigWord = $('bigWord');


function loadTexts(){

  let saved = [];

  try{
    saved = JSON.parse(
      localStorage.getItem('arabicReadingTexts') || '[]'
    );
  }catch(e){
    saved = [];
  }

  texts = [
    ...DEFAULT_TEXTS,
    ...saved.filter(x => x && x.id)
  ];

  fillTextSelect();
}


function fillTextSelect(){

  textSelect.innerHTML = '';

  texts.forEach(t => {

    const option = document.createElement('option');

    option.value = t.id;
    option.textContent = t.name;

    textSelect.appendChild(option);

  });
}


function selectText(id){

  currentText =
    texts.find(t => t.id === id) ||
    texts[0];

  textEditor.value = currentText.text;

  build(currentText.text);
}


function tokenize(text){

  return text
    .trim()
    .split(/\s+/)
    .filter(Boolean);

}


function build(text){

  words = tokenize(text);

  idx = 0;

  reading.innerHTML = '';

  words.forEach((word,i) => {

    const span = document.createElement('span');

    span.className = 'w';

    span.dataset.i = i;

    span.textContent = word + ' ';

    span.onclick = () => {
      idx = i;
      paint();
    };

    reading.appendChild(span);

  });

  paint();
}


function paint(){

  const spans =
    [...reading.querySelectorAll('.w')];

  spans.forEach((span,i) => {

    span.classList.toggle(
      'now',
      i === idx
    );

  });


  bigWord.textContent =
    mode === 'word'
      ? (words[idx] || '—')
      : 'اقرئي ' +
        (mode === 'sentence'
          ? 'الجملة'
          : 'النص');


  $('progress').style.width =
    words.length
      ? ((idx + 1) / words.length * 100) + '%'
      : '0%';

}


function sentenceAt(i){

  let start = i;
  let end = i;

  const isEnd = word =>
    /[.!؟؛…]$/.test(word);


  while(
    start > 0 &&
    !isEnd(words[start - 1])
  ){
    start--;
  }


  while(
    end < words.length - 1 &&
    !isEnd(words[end])
  ){
    end++;
  }


  return words
    .slice(start,end + 1)
    .join(' ');
}


function referenceText(){

  if(mode === 'word'){
    return words[idx] || '';
  }

  if(mode === 'sentence'){
    return sentenceAt(idx);
  }

  return words.join(' ');
}


async function getToken(){

  const response =
    await fetch(
      CONFIG.tokenEndpoint,
      {
        method:'GET',
        cache:'no-store'
      }
    );


  if(!response.ok){
    throw new Error(
      'تعذر الحصول على رمز Azure'
    );
  }


  const data =
    await response.json();


  speechToken =
    data.token ||
    data.access_token ||
    data;


  return speechToken;
}


async function getSpeechConfig(){

  if(!window.SpeechSDK){
    throw new Error(
      'Speech SDK لم يتم تحميله'
    );
  }


  const token =
    await getToken();


  const config =
    SpeechSDK.SpeechConfig
      .fromAuthorizationToken(
        token,
        CONFIG.region
      );


  config.speechSynthesisVoiceName =
    CONFIG.voice;

  config.speechRecognitionLanguage =
    'ar-JO';


  return config;
}


function speak(text){

  if(!text){
    return;
  }


  getSpeechConfig()

    .then(config => {

      const synthesizer =
        new SpeechSDK.SpeechSynthesizer(
          config
        );


      $('sayBtn').disabled = true;


      synthesizer.speakTextAsync(

        text,

        () => {

          synthesizer.close();

          $('sayBtn').disabled = false;

        },

        error => {

          synthesizer.close();

          $('sayBtn').disabled = false;

          showStatus(
            'حدث خطأ في الصوت: ' +
            error,
            true
          );

        }

      );

    })

    .catch(error => {

      showStatus(
        error.message,
        true
      );

    });

}


function showStatus(message,error=false){

  $('status').textContent = message;

  $('status').style.color =
    error
      ? 'var(--bad)'
      : 'var(--good)';
}


function clearAssessment(){

  $('score').textContent = '';

  reading
    .querySelectorAll(
      '.read-good,.read-bad'
    )
    .forEach(span => {

      span.classList.remove(
        'read-good',
        'read-bad'
      );

    });

}


async function assess(){

  clearAssessment();

  showStatus('🎤 استمعي...');

  $('micBtn').disabled = true;


  const reference =
    referenceText();


  if(!reference){

    showStatus(
      'لا يوجد نص للتقييم',
      true
    );

    $('micBtn').disabled = false;

    return;
  }


  let recognizer;


  try{

    const config =
      await getSpeechConfig();


    const audio =
      SpeechSDK.AudioConfig
        .fromDefaultMicrophoneInput();


    recognizer =
      new SpeechSDK.SpeechRecognizer(
        config,
        audio
      );


    const pronunciation =
      new SpeechSDK
        .PronunciationAssessmentConfig(

          reference,

          SpeechSDK
            .PronunciationAssessmentGradingSystem
            .HundredMark,

          SpeechSDK
            .PronunciationAssessmentGranularity
            .Word,

          true

        );


    pronunciation
      .enableProsodyAssessment = false;


    pronunciation.applyTo(
      recognizer
    );


    recognizer.recognizeOnceAsync(

      result => {

        try{

          const json =
            result.properties.getProperty(
              SpeechSDK.PropertyId
                .SpeechServiceResponse_JsonResult
            );


          const data =
            JSON.parse(json);


          const best =
            data.NBest &&
            data.NBest[0];


          const pronunciationScore =
            best &&
            best.PronunciationAssessment
              ? Number(
                  best.PronunciationAssessment
                    .PronScore
                )
              : 0;


          const score =
            Math.round(
              pronunciationScore || 0
            );


          $('score').textContent =
            'النتيجة: ' +
            score +
            '%';


          paintWordResults(
            best && best.Words
              ? best.Words
              : []
          );


          if(score >= 85){

            showStatus(
              '✅ ممتاز! قراءة واضحة.'
            );

          }
          else if(score >= 70){

            showStatus(
              '🟡 جيد، راجعي الكلمات المظللة بالأحمر.'
            );

          }
          else{

            showStatus(
              '❌ تحتاجين تدريبًا أكثر، ثم أعيدي المحاولة.'
            );

          }


          if(
            mode === 'word' &&
            score >= 85 &&
            idx < words.length - 1
          ){

            setTimeout(() => {

              idx++;

              paint();

            },500);

          }

        }
        catch(e){

          showStatus(
            'تعذر تحليل نتيجة النطق.',
            true
          );

        }


        recognizer.close();

        $('micBtn').disabled = false;

      },


      error => {

        recognizer.close();

        $('micBtn').disabled = false;

        showStatus(
          'تعذر استخدام الميكروفون: ' +
          (
            error &&
            error.message
              ? error.message
              : 'خطأ غير معروف'
          ),
          true
        );

      }

    );

  }


  catch(error){

    if(recognizer){
      recognizer.close();
    }

    $('micBtn').disabled = false;

    showStatus(
      error.message || 'حدث خطأ',
      true
    );

  }

}


function normalizeWord(word){

  return String(word || '')

    .replace(
      /[ًٌٍَُِّْـ]/g,
      ''
    )

    .replace(
      /[،,.!؟؛:()«»“”"']/g,
      ''
    )

    .trim();

}


function paintWordResults(results){

  if(mode !== 'word'){
    return;
  }


  const reference =
    normalizeWord(
      words[idx]
    );


  const spans =
    [...reading.querySelectorAll('.w')];


  let found = null;


  for(const word of results){

    const raw =
      word.Word ||
      word.word ||
      '';


    if(
      normalizeWord(raw) === reference
    ){

      found = word;

      break;

    }

  }


  const score =
    found &&
    found.PronunciationAssessment
      ? Number(
          found.PronunciationAssessment
            .AccuracyScore
        )
      : 0;


  if(spans[idx]){

    spans[idx].classList.add(

      score >= 85
        ? 'read-good'
        : 'read-bad'

    );

  }

}


$('sayBtn').onclick =
  () => speak(referenceText());


$('micBtn').onclick =
  assess;


$('prevBtn').onclick = () => {

  idx = Math.max(
    0,
    idx - 1
  );

  paint();

};


$('nextBtn').onclick = () => {

  idx = Math.min(
    words.length - 1,
    idx + 1
  );

  paint();

};


$('resetBtn').onclick = () => {

  idx = 0;

  clearAssessment();

  paint();

  showStatus(
    'تمت إعادة التعيين.'
  );

};


textSelect.onchange =
  event => selectText(
    event.target.value
  );


document
  .querySelectorAll('[data-mode]')
  .forEach(button => {

    button.onclick = () => {

      mode =
        button.dataset.mode;


      document
        .querySelectorAll('[data-mode]')
        .forEach(other => {

          other.classList.toggle(
            'active',
            other === button
          );

        });


      clearAssessment();

      paint();

    };

  });


$('saveTextBtn').onclick = () => {

  const name =
    $('newTextName')
      .value
      .trim() ||
    'نص جديد';


  const text =
    textEditor
      .value
      .trim();


  if(!text){

    showStatus(
      'اكتبي نصًا أولًا.',
      true
    );

    return;

  }


  const id =
    'custom_' +
    Date.now();


  const custom =
    texts.filter(
      t =>
        !String(t.id)
          .startsWith('default')
    );


  custom.push({
    id,
    name,
    text
  });


  localStorage.setItem(
    'arabicReadingTexts',
    JSON.stringify(custom)
  );


  loadTexts();


  textSelect.value = id;

  selectText(id);


  $('newTextName').value = '';


  showStatus(
    '💾 تم حفظ النص.'
  );

};


$('deleteTextBtn').onclick = () => {

  if(
    !currentText ||
    String(currentText.id)
      .startsWith('default')
  ){

    showStatus(
      'النصوص الأساسية لا يمكن حذفها.',
      true
    );

    return;

  }


  const custom =
    texts.filter(
      t =>
        !String(t.id)
          .startsWith('default') &&
        t.id !== currentText.id
    );


  localStorage.setItem(
    'arabicReadingTexts',
    JSON.stringify(custom)
  );


  loadTexts();


  selectText(texts[0].id);


  textSelect.value =
    texts[0].id;


  showStatus(
    '🗑 تم حذف النص.'
  );

};


textEditor.oninput = () => {

  if(currentText){

    currentText.text =
      textEditor.value;

    build(
      textEditor.value
    );

  }

};


loadTexts();

selectText(
  texts[0].id
);

showStatus(
  'جاهز ✅'
);

</script>

</body>
</html>
