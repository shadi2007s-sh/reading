<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>تدرّب على القراءة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbf6e9;--ink:#2f3437;--rule:#cfe0e8;--margin:#e2725b;
    --ok:#2f8f5b;--ok-soft:#dff0e3;--live:#e0a11b;
    --shadow:0 18px 40px -18px rgba(47,52,55,.45);
    --font-read:"Noto Naskh Arabic",serif;
    --font-ui:"Baloo Bhaijaan 2","Noto Naskh Arabic",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--font-ui);
    background:radial-gradient(circle at 15% 10%,#fff7e2 0%,transparent 55%),
               radial-gradient(circle at 85% 90%,#eaf3f6 0%,transparent 55%),#efe7d4;
    color:var(--ink);min-height:100vh;padding:12px 12px 210px}
  .wrap{max-width:760px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  h1{font-size:1.05rem;margin:0;font-weight:800}
  h1 span{color:var(--margin)}
  .stats{display:flex;gap:6px}
  .pill{background:#fff;border:2px solid #e6dcc6;border-radius:999px;padding:4px 10px;
    font-size:.8rem;font-weight:700;box-shadow:0 2px 0 #e6dcc6;white-space:nowrap}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tabs button{flex:1;padding:9px;font-size:.9rem;border-radius:12px;border:2px solid #d9cdb2;
    background:#fff;box-shadow:none;font-weight:700}
  .tabs button.act{background:var(--ink);color:#fff;border-color:var(--ink)}
  .card{background:var(--paper);border-radius:22px;border:1px solid #e6dcc6;box-shadow:var(--shadow);
    padding:18px;text-align:center;position:relative;overflow:hidden}
  .counter{font-size:.85rem;color:#8b9096;font-weight:700}
  .ghostw{font-family:var(--font-read);font-size:1.25rem;color:#bfb69f;min-height:1.6em;
    display:flex;justify-content:center;gap:14px;align-items:center}
  .bigword{font-family:var(--font-read);font-size:clamp(3rem,17vw,6rem);font-weight:700;
    line-height:1.5;padding:6px 4px 10px;letter-spacing:.02em;transition:transform .2s}
  .bigword.ok{color:var(--ok)}
  .bigword.pop{animation:pop .45s}
  @keyframes pop{40%{transform:scale(1.18) rotate(-2deg)}}
  .bigword.miss{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(10px)}75%{transform:translateX(-10px)}}
  .sheet{position:relative;background:var(--paper);border-radius:18px;padding:24px 20px;
    box-shadow:var(--shadow);border:1px solid #e6dcc6;
    background-image:repeating-linear-gradient(to bottom,transparent 0 61px,var(--rule) 61px 62px);overflow:hidden}
  .sheet::before{content:"";position:absolute;top:0;bottom:0;right:46px;width:2px;background:var(--margin);opacity:.5}
  #text{font-family:var(--font-read);font-size:1.9rem;line-height:1.95;text-align:justify}
  .w{display:inline-block;padding:2px 6px;margin:0 1px;border-radius:10px;transition:all .18s;position:relative;cursor:pointer}
  .w.done{color:var(--ok);background:var(--ok-soft)}
  .w.now{background:#fff3cf;box-shadow:0 0 0 3px #f6d97a inset}
  .w.spk{background:#d7ecfa;box-shadow:0 0 0 3px #7cc0e8 inset}
  .bar{height:12px;background:#e6dcc6;border-radius:999px;margin:14px 0 4px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#f0b429,#2f8f5b);transition:width .3s}
  .heard{margin-top:8px;min-height:24px;font-size:.88rem;color:#7b8085;text-align:center}
  .heard b{color:var(--live)}
  small.note{display:block;text-align:center;color:#8b9096;font-size:.72rem;margin-top:6px}
  .controls{position:fixed;bottom:0;right:0;left:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,#efe7d4 74%,rgba(239,231,212,0))}
  .row{display:flex;gap:7px;max-width:760px;margin:0 auto}
  .row+.row{margin-top:7px}
  button{font-family:var(--font-ui);font-weight:700;font-size:.98rem;border:2px solid var(--ink);
    border-radius:14px;background:#fff;color:var(--ink);padding:11px 8px;cursor:pointer;flex:1;
    box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s;touch-action:manipulation}
  button:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
  button.mic{background:#2f8f5b;color:#fff;border-color:#1e5c3b;box-shadow:0 4px 0 #1e5c3b;flex:2}
  button.mic.on{background:#e2725b;border-color:#a8442f;box-shadow:0 4px 0 #a8442f;animation:glow 1.2s infinite}
  button.hold{background:#5aa9d6;color:#fff;border-color:#2d6a8f;box-shadow:0 4px 0 #2d6a8f;flex:2}
  button.read{background:#f0b429;border-color:#9a7413;box-shadow:0 4px 0 #9a7413;flex:2}
  @keyframes glow{50%{filter:brightness(1.15)}}
  button.ghost{background:transparent;border-style:dashed;box-shadow:none;font-size:.8rem;padding:7px}
  button.ghost:active{transform:none}
  dialog{border:none;border-radius:18px;padding:18px;max-width:92vw;width:560px;
    box-shadow:var(--shadow);background:var(--paper);font-family:var(--font-ui)}
  dialog::backdrop{background:rgba(47,52,55,.5)}
  textarea{width:100%;height:170px;font-family:var(--font-read);font-size:1.15rem;
    border:2px solid #d9cdb2;border-radius:12px;padding:10px;background:#fff}
  #diag{font-size:.8rem;line-height:1.7;background:#fff;border-radius:12px;padding:10px;border:2px solid #e6dcc6}
  #diag div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed #eee;padding:3px 0}
  .win{position:fixed;inset:0;display:none;place-items:center;background:rgba(47,52,55,.75);z-index:9;text-align:center;color:#fff;padding:20px}
  .win.show{display:grid}
  .win h2{font-size:2rem;margin:.2em 0}
  .confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:10;pointer-events:none;border-radius:2px}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>اقرئي <span>كلمة كلمة</span> 📖</h1>
    <div class="stats">
      <div class="pill">⭐ <span id="score">0</span></div>
      <div class="pill">📊 <span id="prog">0</span>%</div>
    </div>
  </header>
  <div class="tabs">
    <button id="tabCard" class="act">🔠 كلمة وحدة</button>
    <button id="tabFull">📄 النص كامل</button>
  </div>
  <div class="card" id="cardView">
    <div class="counter">الكلمة <span id="cnow">1</span> من <span id="ctot">1</span></div>
    <div class="ghostw"><span id="prevw"></span></div>
    <div class="bigword" id="bigword">…</div>
    <div class="ghostw"><span id="nextw"></span></div>
  </div>
  <div class="sheet hide" id="fullView">
    <div id="text"></div>
  </div>
  <div class="bar"><i id="fill"></i></div>
  <div class="heard" id="heard">اضغطي 🔊 لتسمعي الكلمة، وبعدين 🎤 لتقرئيها.</div>
  <small class="note">🎧 «اقرأ لي» بيقرا النص كامل — و«رددي ورايي» بيقرا كلمة وبستنّاكِ تعيديها</small>
</div>
<div class="controls">
  <div class="row">
    <button class="mic" id="micBtn">🎤 ابدئي القراءة</button>
    <button id="sayBtn">🔊 اسمعي</button>
    <button id="okBtn">✓ صح</button>
  </div>
  <div class="row">
    <button class="hold" id="holdBtn">🎙 اضغطي واحكِ</button>
    <button id="prevBtn">⏮ السابقة</button>
    <button id="nextBtn">⏭ التالية</button>
  </div>
  <div class="row">
    <button class="read" id="readBtn">📖 اقرأ لي النص</button>
    <button id="echoBtn">🔁 رددي ورايي</button>
  </div>
  <div class="row">
    <button class="ghost" id="diagBtn">🩺 فحص</button>
    <button class="ghost" id="editBtn">✎ غيّري النص</button>
    <button class="ghost" id="resetBtn">↺ من البداية</button>
  </div>
</div>
<div class="win" id="win">
  <div>
    <div style="font-size:4rem">🏆</div>
    <h2>أحسنتِ! خلّصتِ النص</h2>
    <p id="winMsg"></p>
    <button style="max-width:220px;margin:auto;background:#fff" onclick="restart()">↺ مرة ثانية</button>
  </div>
</div>
<dialog id="dlg">
  <h3 style="margin-top:0">غيّري النص</h3>
  <textarea id="ta"></textarea>
  <div class="row" style="margin-top:10px">
    <button onclick="applyText()">حفظ وابدأ</button>
    <button class="ghost" onclick="document.getElementById('dlg').close()">إلغاء</button>
  </div>
</dialog>
<dialog id="diagDlg">
  <h3 style="margin-top:0">🩺 فحص الصوت والمايك</h3>
  <div id="diag">جارٍ الفحص…</div>
  <div class="row" style="margin-top:10px">
    <button onclick="document.getElementById('diagDlg').close()">تمام</button>
  </div>
</dialog>
<script>
const DEFAULT_TEXT = "تدوينُ رؤوسِ الأقلامِ إحدى التقنياتِ التي دعتِ الحاجةُ إليها، نظرًا لكثرةِ وسائلِ الاتصالِ، فلمَ لا تبادرُ إلى استخدامِ هذه التقنية في دراسِتك؟";
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const LANGS = ['ar-JO','ar-SA','ar-EG','ar'];
let langI=0, words=[], idx=0, score=0, listening=false, rec=null, micOK=false;
let reading=false, echo=false, holdRec=null;
const $ = id => document.getElementById(id);
const say = h => $('heard').innerHTML = h;
function norm(s){
  return (s||"").replace(/[ً-ْٰـ]/g,"")
    .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
    .replace(/ؤ/g,"و").replace(/ئ/g,"ي")
    .replace(/[^ء-ي0-9a-zA-Z]/g,"").trim();
}
function sim(a,b){
  if(a===b) return 1;
  if(!a||!b) return 0;
  const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return 1-d[m][n]/Math.max(m,n);
}
function accept(said,target){
  const t=norm(target), s=norm(said);
  if(!t) return true; if(!s) return false; if(s===t) return true;
  if(t.length>3 && (s.includes(t)||t.includes(s))) return true;
  const th = t.length<=3 ? .95 : (t.length<=5 ? .75 : .68);
  return sim(s,t) >= th;
}
function build(txt){
  const box=$('text'); box.innerHTML="";
  words = txt.trim().split(/\s+/).filter(Boolean);
  words.forEach((w,i)=>{
    const el=document.createElement('span');
    el.className='w'; el.textContent=w; el.onclick=()=>{idx=i;paint();};
    box.appendChild(el); box.appendChild(document.createTextNode(' '));
  });
  idx=0; score=0; paint();
}
function paint(){
  document.querySelectorAll('.w').forEach((el,i)=>{
    el.classList.toggle('done',i<idx);
    el.classList.toggle('now',i===idx && !reading);
  });
  $('bigword').textContent = words[idx] || '🎉';
  $('bigword').className = 'bigword';
  $('prevw').textContent = idx>0 ? words[idx-1] : '';
  $('nextw').textContent = idx<words.length-1 ? words[idx+1] : '';
  $('cnow').textContent = Math.min(idx+1, words.length);
  $('ctot').textContent = words.length;
  const pct = words.length ? Math.round(idx/words.length*100) : 0;
  $('fill').style.width=pct+'%'; $('prog').textContent=pct; $('score').textContent=score;
  const cur=document.querySelector('.w.now');
  if(cur && !$('fullView').classList.contains('hide')) cur.scrollIntoView({block:'center',behavior:'smooth'});
}
let ac;
function beep(f,d){
  try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(); o.frequency.value=f;
    g.gain.setValueAtTime(.001,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.22,ac.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+d);
  }catch(e){}
}
function arVoice(){
  const vs = speechSynthesis.getVoices();
  return vs.find(v=>/^ar/i.test(v.lang)) || vs.find(v=>/arab/i.test(v.name)) || null;
}
function speak(t, rate, cb){
  try{
    const u=new SpeechSynthesisUtterance(t);
    u.lang='ar-SA'; u.rate=rate||.8; u.pitch=1;
    const v=arVoice(); if(v){ u.voice=v; u.lang=v.lang; }
    u.onend=()=>cb&&cb(); u.onerror=()=>cb&&cb();
    speechSynthesis.speak(u);
  }catch(e){ cb&&cb(); }
}
function correct(){
  const b=$('bigword'); b.classList.add('ok','pop'); setTimeout(()=>b.classList.remove('pop'),450);
  beep(880,.12); setTimeout(()=>beep(1320,.14),90);
  score++; idx++;
  if(idx>=words.length){ paint(); finish(); return; }
  setTimeout(paint,180);
}
function wrong(){
  const b=$('bigword'); b.classList.add('miss'); setTimeout(()=>b.classList.remove('miss'),350);
}
function finish(){
  stopAll();
  $('winMsg').textContent='قرأتِ '+words.length+' كلمة وجمعتِ '+score+' نجمة ⭐';
  $('win').classList.add('show');
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.25),i*140));
  for(let i=0;i<60;i++) confetti();
}
function confetti(){
  const c=document.createElement('div'); c.className='confetti';
  c.style.left=Math.random()*100+'vw';
  c.style.background=['#e2725b','#f0b429','#2f8f5b','#5aa9d6','#fff'][Math.floor(Math.random()*5)];
  document.body.appendChild(c);
  c.animate([{transform:'translateY(0) rotate(0)'},{transform:'translateY(105vh) rotate(720deg)'}],
    {duration:2200+Math.random()*1600,easing:'ease-in'}).onfinish=()=>c.remove();
}
function restart(){ $('win').classList.remove('show'); idx=0; score=0; paint(); }
function readAloud(from){
  if(reading){ stopRead(); return; }
  stopMic(); echo=false;
  reading=true; $('readBtn').textContent='⏹ وقّف القراءة';
  let i = (from!==undefined?from:idx);
  const step = ()=>{
    if(!reading || i>=words.length){ stopRead(); return; }
    document.querySelectorAll('.w').forEach((el,k)=>el.classList.toggle('spk',k===i));
    $('bigword').textContent = words[i];
    $('cnow').textContent = i+1;
    $('prevw').textContent = i>0?words[i-1]:'';
    $('nextw').textContent = i<words.length-1?words[i+1]:'';
    say('🎧 بقرا: <b>'+words[i]+'</b>');
    speak(words[i], .75, ()=>{ i++; setTimeout(step, 260); });
  };
  step();
}
function stopRead(){
  reading=false; try{speechSynthesis.cancel();}catch(e){}
  document.querySelectorAll('.w').forEach(el=>el.classList.remove('spk'));
  $('readBtn').textContent='📖 اقرأ لي النص';
  paint(); say('خلصت القراءة ✨ جرّبي تقرئي إنتِ هلأ.');
}
function echoMode(){
  if(echo){ echo=false; $('echoBtn').textContent='🔁 رددي ورايي'; stopMic(); try{speechSynthesis.cancel();}catch(e){} say('وقّفنا وضع الترديد.'); return; }
  if(!SR){ say('المتصفح ما بيدعم المايك — بس بقدر أقرالك 📖'); return; }
  echo=true; $('echoBtn').textContent='⏹ وقّف الترديد';
  echoStep();
}
async function echoStep(){
  if(!echo || idx>=words.length) return;
  if(!(await primeMic())){ echo=false; $('echoBtn').textContent='🔁 رددي ورايي'; return; }
  paint(); say('🎧 اسمعي: <b>'+words[idx]+'</b>');
  speak(words[idx], .7, ()=>{
    if(!echo) return;
    say('🎤 دورك… رددي الكلمة');
    listenOnce(ok=>{
      if(!echo) return;
      if(ok){ correct(); setTimeout(echoStep, 500); }
      else { wrong(); say('مش مضبوط، بعيدها 🔁'); setTimeout(echoStep, 500); }
    });
  });
}
function listenOnce(cb){
  let done=false;
  const r = makeRec(false);
  r.onresult = e=>{
    let h="";
    for(let i=e.resultIndex;i<e.results.length;i++)
      for(let a=0;a<e.results[i].length;a++) h += " " + e.results[i][a].transcript;
    say('سمعت: <b>'+h.trim()+'</b>');
    if(done) return;
    const hit = h.trim().split(/\s+/).some(t=>accept(t, words[idx]));
    if(hit){ done=true; try{r.stop();}catch(e){} cb(true); }
  };
  r.onend = ()=>{ if(!done){ done=true; cb(false); } };
  try{ r.start(); }catch(e){ cb(false); }
  setTimeout(()=>{ try{ r.stop(); }catch(e){} }, 6000);
}
async function primeMic(){
  if(micOK) return true;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ micOK=true; return true; }
  try{
    const st = await navigator.mediaDevices.getUserMedia({audio:true});
    st.getTracks().forEach(t=>t.stop()); micOK=true; return true;
  }catch(e){
    say('⛔ المايك مرفوض ('+e.name+'). اسمحي للموقع بالمايك أو استخدمي <b>✓ صح</b>.');
    return false;
  }
}
function makeRec(continuous){
  const r=new SR();
  r.lang=LANGS[langI]; r.continuous=continuous && !IOS; r.interimResults=!IOS; r.maxAlternatives=3;
  r.onerror = ev=>{
    if(ev.error==='language-not-supported' && langI<LANGS.length-1){ langI++; say('بجرّب لغة ثانية: '+LANGS[langI]); return; }
    if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){ say('⛔ المتصفح رافض المايك.'); stopMic(); return; }
    if(ev.error==='network'){ say('🌐 التعرّف على الصوت محتاج إنترنت.'); return; }
    if(ev.error!=='no-speech'&&ev.error!=='aborted') say('خطأ: <b>'+ev.error+'</b>');
  };
  return r;
}
function handleT(h){
  say('سمعت: <b>'+h.trim()+'</b>');
  let guard=0;
  for(const tk of h.trim().split(/\s+/)){
    if(idx>=words.length) break;
    if(accept(tk,words[idx])){ correct(); guard++; }
    else if(idx+1<words.length && accept(tk,words[idx+1])){ correct(); correct(); guard++; }
    if(guard>25) break;
  }
}
async function startMic(){
  if(!SR){ say('😕 المتصفح ما بيدعم التعرّف على الصوت. استخدمي <b>✓ صح</b>.'); return; }
  if(!window.isSecureContext){ say('🔒 لازم https.'); return; }
  if(!(await primeMic())) return;
  reading=false; echo=false;
  try{
    rec=makeRec(true);
    rec.onresult=e=>{ let h="";
      for(let i=e.resultIndex;i<e.results.length;i++)
        for(let a=0;a<e.results[i].length;a++) h+=" "+e.results[i][a].transcript;
      handleT(h); };
    rec.onend=()=>{ if(listening){ try{rec.start();}catch(e){} } };
    rec.start(); listening=true;
    $('micBtn').classList.add('on'); $('micBtn').textContent='⏹ إيقاف';
    say('🎧 أنا أسمعك… اقرئي الكلمة الكبيرة.');
  }catch(e){ say('ما قدرت أشغّل المايك.'); }
}
function stopMic(){
  listening=false;
  try{ rec && (rec.onend=null, rec.stop()); }catch(e){}
  $('micBtn').classList.remove('on'); $('micBtn').textContent='🎤 ابدئي القراءة';
}
function stopAll(){ stopMic(); reading=false; echo=false;
  $('echoBtn').textContent='🔁 رددي ورايي'; $('readBtn').textContent='📖 اقرأ لي النص';
  try{speechSynthesis.cancel();}catch(e){} }
async function holdStart(ev){
  ev.preventDefault();
  if(!SR){ say('المتصفح ما بيدعم المايك.'); return; }
  if(!(await primeMic())) return;
  stopMic();
  try{
    holdRec=makeRec(false);
    holdRec.onresult=e=>{ let h="";
      for(let i=e.resultIndex;i<e.results.length;i++)
        for(let a=0;a<e.results[i].length;a++) h+=" "+e.results[i][a].transcript;
      handleT(h); };
    holdRec.onend=()=>{ $('holdBtn').textContent='🎙 اضغطي واحكِ'; };
    holdRec.start(); $('holdBtn').textContent='🔴 احكِ الآن…';
  }catch(e){}
}
function holdEnd(){ try{ holdRec && holdRec.stop(); }catch(e){} }
async function runDiag(){
  const rows=[]; const add=(k,v,g)=>rows.push('<div><span>'+k+'</span><b style="color:'+(g?'#2f8f5b':'#e2725b')+'">'+v+'</b></div>');
  add('التعرّف على الصوت', SR?'مدعوم ✓':'غير مدعوم ✗', !!SR);
  add('اتصال آمن https', window.isSecureContext?'نعم ✓':'لا ✗', window.isSecureContext);
  const v=arVoice();
  add('صوت عربي للقراءة', v? v.name : 'ما في صوت عربي ✗', !!v);
  add('عدد الأصوات', speechSynthesis.getVoices().length, true);
  let perm='غير معروف', good=true;
  try{ const p=await navigator.permissions.query({name:'microphone'}); perm=p.state; good=p.state!=='denied'; }catch(e){}
  add('إذن المايك', perm, good);
  try{ const st=await navigator.mediaDevices.getUserMedia({audio:true});
    st.getTracks().forEach(t=>t.stop()); add('فتح المايك','نجح ✓',true);
  }catch(e){ add('فتح المايك','فشل: '+e.name,false); }
  add('اللغة', LANGS[langI], true);
  $('diag').innerHTML = rows.join('') +
   '<p style="margin:10px 0 0;color:#7b8085">إذا «صوت عربي» أحمر: نزّلي صوت عربي من إعدادات الجهاز (Android: إعدادات ثم اللغة ثم تحويل النص لكلام ثم تنزيل العربية — iPhone: الإعدادات ثم إمكانية الوصول ثم المحتوى المنطوق ثم الأصوات ثم العربية).</p>';
}
$('tabCard').onclick=()=>{ $('cardView').classList.remove('hide'); $('fullView').classList.add('hide');
  $('tabCard').classList.add('act'); $('tabFull').classList.remove('act'); };
$('tabFull').onclick=()=>{ $('fullView').classList.remove('hide'); $('cardView').classList.add('hide');
  $('tabFull').classList.add('act'); $('tabCard').classList.remove('act'); paint(); };
$('micBtn').onclick=()=> listening?stopMic():startMic();
$('sayBtn').onclick=()=> words[idx] && speak(words[idx], .7);
$('okBtn').onclick=()=> idx<words.length && correct();
$('prevBtn').onclick=()=>{ if(idx>0){ idx--; paint(); } };
$('nextBtn').onclick=()=>{ if(idx<words.length){ wrong(); idx++; paint(); if(idx>=words.length) finish(); } };
$('readBtn').onclick=()=> readAloud();
$('echoBtn').onclick=()=> echoMode();
$('resetBtn').onclick=()=>{ stopAll(); restart(); };
$('editBtn').onclick=()=>{ $('ta').value=words.join(' '); $('dlg').showModal(); };
$('diagBtn').onclick=()=>{ $('diag').innerHTML='جارٍ الفحص…'; $('diagDlg').showModal(); runDiag(); };
const hb=$('holdBtn');
hb.addEventListener('pointerdown',holdStart);
hb.addEventListener('pointerup',holdEnd);
hb.addEventListener('pointercancel',holdEnd);
hb.addEventListener('pointerleave',holdEnd);
function applyText(){ const v=$('ta').value.trim(); if(v) build(v); $('dlg').close(); }
if(window.speechSynthesis) speechSynthesis.onvoiceschanged=()=>{};
build(DEFAULT_TEXT);
</script>
