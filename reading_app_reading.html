<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>تدريب القراءة</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f9ff;--card:#fff;--text:#25324a;--muted:#738096;--blue:#4d7cf3;--blue2:#edf3ff;--green:#3aa56d;--yellow:#ffbd52;--border:#dfe8f5;--shadow:0 12px 32px rgba(53,83,120,.10);--ui:"Baloo Bhaijaan 2",sans-serif;--read:"Noto Naskh Arabic",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui)}body{min-height:100vh;padding:14px 12px 28px}.app{max-width:760px;margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}.title{font-size:1.45rem;font-weight:800}.sub{font-size:.85rem;color:var(--muted)}
.top button,.ghostbtn{border:2px solid var(--border);background:#fff;color:var(--text);border-radius:16px;padding:9px 13px;font:700 .95rem var(--ui);box-shadow:none}
.main{background:var(--card);border:2px solid var(--border);border-radius:28px;box-shadow:var(--shadow);padding:20px}.counter{text-align:center;color:var(--muted);font-weight:700;font-size:.9rem}.sentence{font-family:var(--read);font-size:clamp(2rem,7vw,3.4rem);line-height:1.8;text-align:center;min-height:180px;display:flex;align-items:center;justify-content:center;padding:15px 6px}.sentence .activeWord{background:#fff1cc;border-radius:12px;box-shadow:inset 0 0 0 3px #ffd66b}.text-view{font-family:var(--read);font-size:1.7rem;line-height:2.1;background:#fbfdff;border:2px solid #edf2f9;border-radius:22px;padding:20px;max-height:52vh;overflow:auto}.text-view p{margin:0 0 12px}.text-view p:last-child{margin-bottom:0}.text-view .currentSentence{background:#fff6dc;border-radius:12px;padding:3px 6px}
.progress{height:10px;background:#edf2f8;border-radius:999px;overflow:hidden;margin:12px 0 16px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--green))}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{min-height:60px;border:2px solid var(--border);border-radius:20px;background:#fff;font:800 1.05rem var(--ui);color:var(--text);box-shadow:0 3px 0 #d8e1ed}.actions button:active{transform:translateY(3px);box-shadow:none}.actions .listen{background:#fff7e6;border-color:#ffd98a;color:#986500}.actions .read{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 3px 0 #355fca}.actions .mic{background:#eaf8f0;border-color:#bfe4cf;color:#267b50}.actions .check{background:#eef5ff;border-color:#cbdcff;color:#3564cb}.secondary{display:flex;gap:8px;margin-top:12px}.secondary button{flex:1;min-height:48px;border:2px solid var(--border);background:#fff;border-radius:16px;font:700 .9rem var(--ui)}
.status{text-align:center;min-height:26px;margin-top:12px;color:var(--muted);font-size:.85rem}.status.ok{color:var(--green)}.status.err{color:#c4513d}.result{display:none;margin-top:14px;background:#f7fbff;border:2px solid var(--border);border-radius:20px;padding:12px;text-align:center}.result.show{display:block}.result strong{font-size:1.4rem}
dialog{border:0;border-radius:24px;padding:0;width:min(92vw,470px);box-shadow:0 24px 70px rgba(31,52,84,.22);background:#fff;color:var(--text)}dialog::backdrop{background:rgba(28,43,65,.32)}.dlg{padding:18px}.dlg h3{text-align:center;margin:0 0 12px;font-size:1.2rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid button{min-height:54px;border:2px solid var(--border);background:#f8fbff;border-radius:16px;font:800 .95rem var(--ui);color:var(--text)}.close{width:100%;margin-top:10px;min-height:48px;border:0;border-radius:15px;background:#eef2f7;font:800 .95rem var(--ui)}label{display:block;font-weight:800;margin:11px 0 5px}.dlg select,.dlg textarea,.dlg input[type=range]{width:100%;font:700 1rem var(--ui)}.dlg select{padding:9px;border:2px solid var(--border);border-radius:12px;background:#fff}.dlg textarea{min-height:170px;padding:10px;border:2px solid var(--border);border-radius:14px;font-family:var(--read);line-height:1.9}.save{margin-top:10px;width:100%;min-height:52px;border:0;border-radius:16px;background:var(--blue);color:#fff;font:800 1rem var(--ui)}.list{display:grid;gap:8px;max-height:260px;overflow:auto}.item{display:flex;gap:8px;align-items:center;justify-content:space-between;border:2px solid var(--border);border-radius:14px;padding:8px 10px;background:#fff}.item button{border:2px solid var(--border);background:#f7faff;border-radius:12px;padding:7px 10px;font:700 .85rem var(--ui)}
@media(max-width:560px){body{padding:10px 9px 20px}.main{padding:15px}.sentence{min-height:150px;font-size:clamp(1.85rem,9vw,2.7rem)}.text-view{font-size:1.55rem}.actions button{min-height:56px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="title">📖 تدريب القراءة</div><div class="sub">استمعي، اقرئي، ثم تحققي</div></div>
    <button id="moreBtn">⚙️ المزيد</button>
  </div>

  <main class="main">
    <div class="counter">الجملة <span id="curNo">1</span> من <span id="totalNo">1</span></div>
    <div class="sentence" id="sentence">...</div>
    <div class="progress"><i id="progFill"></i></div>

    <div class="actions">
      <button class="listen" id="listenBtn">🔊 استمعي</button>
      <button class="read" id="readBtn">📖 اقرأ لي</button>
      <button class="mic" id="micBtn">🎤 اقرئي الآن</button>
      <button class="check" id="checkBtn">✅ تحققي</button>
    </div>

    <div class="secondary">
      <button id="prevBtn">◀ السابقة</button>
      <button id="nextBtn">التالية ▶</button>
    </div>

    <div class="status" id="status">جاهزة؟ لنبدأ 🌟</div>
    <div class="result" id="result"></div>
    <div class="text-view" id="fullText" hidden></div>
  </main>
</div>

<dialog id="moreDlg">
  <div class="dlg">
    <h3>ماذا تريدين؟</h3>
    <div class="grid">
      <button data-open="texts">📚 نصوصي</button>
      <button data-open="edit">✏️ تغيير النص</button>
      <button data-open="voice">🔊 إعدادات الصوت</button>
      <button data-open="progress">⭐ تقدمي</button>
      <button data-open="mode">🧩 وضع القراءة</button>
      <button data-open="diag">🩺 فحص الصوت</button>
    </div>
    <button class="close" id="closeMore">إغلاق</button>
  </div>
</dialog>

<dialog id="voiceDlg"><div class="dlg"><h3>🔊 إعدادات الصوت</h3>
  <label>السرعة <span id="rateVal">1.00</span></label><input id="rate" type="range" min="0.7" max="1.25" step="0.05" value="1">
  <label>مستوى الصوت <span id="volVal">100%</span></label><input id="vol" type="range" min="20" max="100" step="5" value="100">
  <div class="status ok" style="margin-top:10px">Sana — العربية الأردنية</div>
  <button class="close" data-close>إغلاق</button>
</div></dialog>

<dialog id="textsDlg"><div class="dlg"><h3>📚 نصوصي</h3><div class="list" id="textList"></div><button class="close" data-close>إغلاق</button></div></dialog>

<dialog id="editDlg"><div class="dlg"><h3>✏️ تغيير النص</h3><label>اسم النص</label><input id="textName" placeholder="مثال: درس اليوم" style="padding:10px;border:2px solid var(--border);border-radius:12px"><label>النص</label><textarea id="textInput"></textarea><button class="save" id="saveText">حفظ النص</button><button class="close" data-close>إغلاق</button></div></dialog>

<dialog id="progressDlg"><div class="dlg"><h3>⭐ تقدمي</h3><div id="progressInfo" style="line-height:2;font-size:1rem"></div><button class="close" data-close>إغلاق</button></div></dialog>

<dialog id="modeDlg"><div class="dlg"><h3>🧩 وضع القراءة</h3><div class="grid"><button data-mode="sentence">جملة جملة</button><button data-mode="full">النص كامل</button></div><button class="close" data-close>إغلاق</button></div></dialog>

<dialog id="diagDlg"><div class="dlg"><h3>🩺 فحص الصوت</h3><div id="diagInfo" style="line-height:1.9"></div><button class="save" id="diagRun">اختبار Sana</button><button class="close" data-close>إغلاق</button></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.46.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
<script>
const CFG={TOKEN_ENDPOINT:'https://reading-speech-api-e9hbc8fscfaxacgv.israelcentral-01.azurewebsites.net/api/speech-token',REGION:'eastus',VOICE:'ar-JO-SanaNeural'};
const $=id=>document.getElementById(id);
const defaultText={name:'نص البداية',text:'أنا أحب القراءة. أتعلم كلمة جديدة كل يوم. وأحاول أن أقرأ بهدوء وثقة.'};
const LS='readingSimpleV13'; const TX='readingSimpleTextsV13';
let texts=JSON.parse(localStorage.getItem(TX)||'null'); if(!Array.isArray(texts)||!texts.length) texts=[defaultText];
let selectedIndex=Number(localStorage.getItem(LS+'Index')||0); if(selectedIndex<0||selectedIndex>=texts.length)selectedIndex=0;
let rate=Number(localStorage.getItem(LS+'Rate')||1); let volume=Number(localStorage.getItem(LS+'Volume')||100); let mode='sentence';
let sentences=[],idx=0,tokenCache=null,readingAll=false,recognizer=null,awaitingCheck=false;
let azureSynth=null,azureSpeaking=false,azureGen=0;
function persist(){localStorage.setItem(TX,JSON.stringify(texts));localStorage.setItem(LS+'Index',selectedIndex);localStorage.setItem(LS+'Rate',rate);localStorage.setItem(LS+'Volume',volume);localStorage.setItem(LS+'Stats',JSON.stringify(stats));}
function splitSentences(t){return String(t||'').replace(/\s+/g,' ').trim().match(/[^.!؟؛]+[.!؟؛]?/g)||[String(t||'').trim()];}
function escapeXml(s){return String(s).replace(/[<>&'\"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','\"':'&quot;'}[c]));}
function setStatus(t,kind=''){ $('status').textContent=t; $('status').className='status '+kind; }
function render(){const t=texts[selectedIndex]; sentences=splitSentences(t.text); if(idx>=sentences.length)idx=Math.max(0,sentences.length-1); $('curNo').textContent=sentences.length?idx+1:0; $('totalNo').textContent=sentences.length||0; $('sentence').textContent=sentences[idx]||'...'; $('progFill').style.width=(sentences.length?(idx+1)/sentences.length*100:0)+'%'; renderFull();}
function renderFull(){const box=$('fullText'); box.innerHTML=''; sentences.forEach((s,i)=>{const p=document.createElement('p');p.textContent=s;if(i===idx)p.className='currentSentence';box.appendChild(p);}); box.hidden=mode!=='full';}
async function getToken(){if(tokenCache&&Date.now()<tokenCache.exp-30000)return tokenCache.token; const r=await fetch(CFG.TOKEN_ENDPOINT,{method:'GET',cache:'no-store'}); if(!r.ok)throw new Error('TOKEN_HTTP_'+r.status); const j=await r.json(); if(!j.token)throw new Error('TOKEN_MISSING'); tokenCache={token:j.token,exp:Date.now()+8*60*1000}; return tokenCache.token;}
function stopAudio(){azureGen++; if(azureSynth){try{azureSynth.close();}catch(e){} azureSynth=null;} azureSpeaking=false;}
async function speakAzure(text){const textValue=String(text||'').trim(); if(!textValue)return; const gen=++azureGen; stopAudio(); if(gen!==azureGen) return; if(!window.SpeechSDK)throw new Error('SDK_LOAD'); const token=await getToken(); if(gen!==azureGen)return; const cfg=window.SpeechSDK.SpeechConfig.fromAuthorizationToken(token,CFG.REGION); cfg.speechSynthesisVoiceName=CFG.VOICE; cfg.speechSynthesisLanguage='ar-JO'; cfg.speechSynthesisOutputFormat=window.SpeechSDK.SpeechSynthesisOutputFormat.Audio24Khz48KBitRateMonoMp3; const ac=window.SpeechSDK.AudioConfig.fromDefaultSpeakerOutput(); azureSynth=new window.SpeechSDK.SpeechSynthesizer(cfg,ac); azureSpeaking=true; return await new Promise((resolve,reject)=>{azureSynth.speakTextAsync(textValue,result=>{if(gen===azureGen){azureSpeaking=false;try{azureSynth.close();}catch(e){}azureSynth=null;resolve(result);}else resolve(result);},err=>{if(gen===azureGen){azureSpeaking=false;try{azureSynth.close();}catch(e){}azureSynth=null;reject(new Error(String(err||'TTS_ERROR')));}else resolve(null);});});}
async function listenCurrent(){try{setStatus('جارٍ تشغيل Sana…');await speakAzure(sentences[idx]||'');setStatus('استماع جميل 🌟','ok');}catch(e){console.error(e);setStatus('تعذر تشغيل Sana: '+e.message,'err');}}
async function readAll(){if(readingAll){readingAll=false;stopAudio();setStatus('تم إيقاف القراءة');return;} readingAll=true; try{setStatus('جارٍ تجهيز القراءة…');await speakAzure(texts[selectedIndex].text);if(readingAll)setStatus('أحسنتِ! انتهت القراءة 🎉','ok');}catch(e){console.error(e);setStatus('تعذر تشغيل القراءة: '+e.message,'err');}finally{readingAll=false;}}

function move(d){idx=Math.max(0,Math.min(sentences.length-1,idx+d));render();setStatus('الجملة '+(idx+1)+' من '+sentences.length);}
async function startMic(){if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){setStatus('الميكروفون الصوتي غير متاح في هذا المتصفح.','err');return;} const R=window.SpeechRecognition||window.webkitSpeechRecognition; if(recognizer){try{recognizer.stop();}catch(e){}} recognizer=new R();recognizer.lang='ar-JO';recognizer.interimResults=false;recognizer.maxAlternatives=1;awaitingCheck=true; setStatus('🎤 اقرئي الجملة الآن…'); recognizer.onresult=e=>{const heard=e.results[0][0].transcript||''; const a=normalize(sentences[idx]),b=normalize(heard); const score=similarity(a,b); stats.attempts=(stats.attempts||0)+1;stats.last=Math.round(score*100);stats.best=Math.max(stats.best||0,Math.round(score*100));persist();$('result').innerHTML=`نتيجتك: <strong>${Math.round(score*100)}%</strong><br><span style="color:var(--muted)">سمعت: ${heard}</span>`;$('result').classList.add('show');setStatus(score>=.8?'رائع! 👏':'محاولة جميلة، أعيدي الجملة بهدوء 🌟',score>=.8?'ok':'');};recognizer.onerror=e=>setStatus('لم أتمكن من سماع الجملة: '+(e.error||'خطأ'),'err');recognizer.onend=()=>{if(awaitingCheck)setStatus('انتهى التسجيل. اضغطي ✅ تحققي');};try{recognizer.start();}catch(e){setStatus('تعذر بدء الميكروفون.','err');}}
function normalize(s){return String(s||'').toLowerCase().replace(/[\u064B-\u0652\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^\u0621-\u064A0-9a-zA-Z ]/g,'').replace(/\s+/g,' ').trim();}
function similarity(a,b){if(!a||!b)return 0;const A=a.split(' '),B=b.split(' ');let used=0;const set=B.map(x=>normalize(x));A.forEach(w=>{const i=set.indexOf(normalize(w));if(i>=0){used++;set[i]='__';}});return used/Math.max(A.length,1);}
function openDialog(id){$(id).showModal();}
function closeDialog(el){el?.closest('dialog')?.close();}
function renderTexts(){const box=$('textList');box.innerHTML='';texts.forEach((t,i)=>{const row=document.createElement('div');row.className='item';row.innerHTML=`<div><strong>${escapeHtml(t.name)}</strong><div style="color:var(--muted);font-size:.78rem">${t.text.slice(0,55)}${t.text.length>55?'…':''}</div></div>`;const b=document.createElement('button');b.textContent=i===selectedIndex?'✓ الحالي':'اختيار';b.onclick=()=>{selectedIndex=i;idx=0;persist();render();$('textsDlg').close();setStatus('تم اختيار: '+texts[i].name,'ok')};row.appendChild(b);box.appendChild(row);});}
function escapeHtml(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));}
function diag(){const info=$('diagInfo');info.innerHTML='جارٍ الفحص…';getToken().then(()=>{info.innerHTML='✅ Token يعمل<br>✅ المنطقة: '+CFG.REGION+'<br>✅ الصوت: Sana<br>اضغطي اختبار Sana.'}).catch(e=>{info.innerHTML='❌ '+e.message;});}
$('moreBtn').onclick=()=>openDialog('moreDlg');$('closeMore').onclick=()=>$('moreDlg').close();
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeDialog(b));
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{ $('moreDlg').close(); const m=b.dataset.open; if(m==='texts'){renderTexts();openDialog('textsDlg')} if(m==='edit'){ $('textName').value=texts[selectedIndex].name; $('textInput').value=texts[selectedIndex].text;openDialog('editDlg')} if(m==='voice'){ $('rate').value=rate;$('rateVal').textContent=rate.toFixed(2);$('vol').value=volume;$('volVal').textContent=volume+'%';openDialog('voiceDlg')} if(m==='progress'){const attempts=stats.attempts||0;$('progressInfo').innerHTML=`المحاولات: <strong>${attempts}</strong><br>أفضل نتيجة: <strong>${stats.best||0}%</strong><br>آخر نتيجة: <strong>${stats.last||0}%</strong>`;openDialog('progressDlg')} if(m==='mode'){openDialog('modeDlg')} if(m==='diag'){diag();openDialog('diagDlg')}});
$('rate').oninput=e=>{rate=Number(e.target.value);$('rateVal').textContent=rate.toFixed(2);persist()};$('vol').oninput=e=>{volume=Number(e.target.value);$('volVal').textContent=volume+'%';$('audio').volume=volume/100;persist()};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render();$('modeDlg').close();setStatus(mode==='full'?'النص الكامل جاهز 📖':'وضع الجملة جاهز 🧩','ok');});
$('saveText').onclick=()=>{const name=$('textName').value.trim()||'نص جديد';const text=$('textInput').value.trim();if(!text){alert('اكتبي نصًا أولًا');return;} const existing=texts.findIndex(t=>t.name===name);if(existing>=0)texts[existing]={name,text},selectedIndex=existing;else{texts.push({name,text});selectedIndex=texts.length-1;}idx=0;persist();render();$('editDlg').close();setStatus('تم حفظ النص ✅','ok');};
$('listenBtn').onclick=listenCurrent;$('readBtn').onclick=readAll;$('prevBtn').onclick=()=>{stopAudio();move(-1)};$('nextBtn').onclick=()=>{stopAudio();move(1)};$('micBtn').onclick=startMic;$('checkBtn').onclick=()=>{if($('result').classList.contains('show'))setStatus('النتيجة معروضة أعلاه 🌟');else startMic()};
$('diagRun').onclick=async()=>{try{setStatus('اختبار Sana…');await speakAzure('مرحبًا، هذا اختبار لصوت سَنا.');setStatus('Sana تعمل بشكل صحيح ✅','ok');diag();}catch(e){$('diagInfo').innerHTML='❌ '+e.message;setStatus('اختبار Sana فشل: '+e.message,'err');}};
render();
</script>
</body></html>
